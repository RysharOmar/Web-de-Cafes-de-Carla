<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafés de Carla | Cafetería y Pedidos Online</title>
    <meta
      name="description"
      content="Disfruta del mejor café, bollería y bocadillos en Cafés de Carla. Pide online a domicilio o escanea el QR de tu mesa para pedir desde el local."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://cafes-de-carla.vercel.app/" />

    <!-- Open Graph: estático, sin JavaScript, para WhatsApp, Facebook, Telegram, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cafés de Carla" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Cafés de Carla" />
    <meta
      property="og:description"
      content="Huele, Saborea, Disfruta. Pide tu café favorito online o desde tu mesa."
    />
    <meta property="og:url" content="https://cafes-de-carla.vercel.app/" />
    <meta property="og:image" content="https://cafes-de-carla.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://cafes-de-carla.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cafés de Carla — Huele, Saborea, Disfruta" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cafés de Carla" />
    <meta
      name="twitter:description"
      content="Huele, Saborea, Disfruta. Pide tu café favorito online o desde tu mesa."
    />
    <meta name="twitter:image" content="https://cafes-de-carla.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Cafés de Carla — Huele, Saborea, Disfruta" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <style>
      :root {
        color-scheme: light;
        background: #e6e2d3;
        color: #4a3322;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #e6e2d3;
      }

      main {
        width: min(100%, 960px);
        text-align: center;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #c9bea9;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(74, 51, 34, 0.16);
      }

      p {
        margin: 20px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #6f6152;
      }

      a {
        color: #6b7c51;
        font-weight: 600;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="https://cafes-de-carla.vercel.app/">
        <img
          src="https://cafes-de-carla.vercel.app/og-image.png"
          alt="Cafés de Carla — Huele, Saborea, Disfruta"
          width="1200"
          height="630"
        />
      </a>
      <p>
        <a href="https://cafes-de-carla.vercel.app/">Entrar en Cafés de Carla</a>
      </p>
    </main>
  </body>
</html>
